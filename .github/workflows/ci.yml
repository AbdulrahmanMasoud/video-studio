name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: worker image · engine smoke · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build worker image (small whisper, all fonts)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          build-args: |
            WHISPER_MODEL=small
          tags: vs-worker:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Engine doctor
        run: docker run --rm vs-worker:ci python3 /app/engine/video-engine/scripts/vt.py doctor
      - name: Lint (ruff, mypy)
        run: docker run --rm vs-worker:ci sh -c "cd /app/apps/worker && ruff check . && mypy vs_worker"
      - name: Engine smoke test (all templates, 9:16 + 16:9, offline)
        run: |
          mkdir -p engine-dev/_smoke
          docker run --rm --shm-size=1g -e VT_OFFLINE=1 -v "$PWD/engine-dev/_smoke:/out" vs-worker:ci \
            python3 /app/engine-dev/smoke.py --sizes 9:16,16:9 --out /out
      - name: pytest apps/worker
        run: docker run --rm --shm-size=1g -e WHISPER_MODEL=small vs-worker:ci python -m pytest /app/apps/worker -q --timeout=1800
      - name: Upload contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-sheets
          path: engine-dev/_smoke/sheet_*.jpg
          if-no-files-found: ignore

  api:
    name: api image · migrations · pytest (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build api image
        run: docker compose build api
      - name: Start dependencies
        run: docker compose up -d postgres redis minio-init mailpit
      - name: Lint (ruff, mypy)
        run: docker compose run --rm --no-deps -e SKIP_MIGRATIONS=1 api sh -c "cd /app/apps/api && ruff check . && mypy vs_api"
      - name: Production compose config is valid
        run: DOMAIN=example.com ACME_EMAIL=x@example.com S3_PUBLIC_ENDPOINT_URL=https://s3.example.com WEB_ORIGIN=https://example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Migrations on a fresh database
        run: docker compose run --rm --no-deps api alembic current
      - name: pytest apps/api (coverage gate 80 %)
        run: |
          docker compose run --rm --no-deps -e SKIP_MIGRATIONS=1 -e RATE_LIMITS_ENABLED=0 api \
            python -m pytest /app/apps/api -q -m "not integration" --cov=vs_api --cov-report=term-missing --cov-fail-under=80
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300

  integration:
    name: full flow (api + worker, mock planner)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [worker, api]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env && echo "PLANNER_MODE=mock" >> .env
      - name: Build and start the stack
        run: docker compose up -d --build postgres redis minio-init mailpit api worker
      - name: Wait for the API
        run: for i in $(seq 1 60); do curl -fsS http://localhost:8000/health && break; sleep 2; done
      - name: Integration test
        run: docker compose run --rm --no-deps -e SKIP_MIGRATIONS=1 -e RATE_LIMITS_ENABLED=0 api python -m pytest /app/apps/api/tests/test_integration.py -q -m integration
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color api worker | tail -400

  web:
    name: web · lint · build · e2e · lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [worker, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Lint + typecheck
        run: cd apps/web && npm ci --no-audit --no-fund && npm run lint && npx tsc --noEmit
      - name: Prepare env
        run: |
          cp .env.example .env
          echo "PLANNER_MODE=mock" >> .env
          echo "S3_PUBLIC_ENDPOINT_URL=http://minio:9000" >> .env
          echo "WEB_ORIGIN=http://web:3000" >> .env
      - name: Build and start the stack (api, worker, web)
        run: docker compose up -d --build postgres redis minio-init mailpit api worker web
      - name: Wait for the web app
        run: for i in $(seq 1 90); do curl -fsS http://localhost:3000/en >/dev/null && break; sleep 2; done
      - name: Playwright e2e (flow + RTL + axe)
        run: docker compose --profile e2e run --rm --build e2e npx playwright test
      - name: Lighthouse accessibility
        run: docker compose --profile e2e run --rm e2e node e2e/lighthouse.mjs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color api worker web | tail -400
