# Dev stack: `docker compose up` brings everything up with only .env.example copied to .env.
name: videostudio
x-env: &env
  env_file: .env

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videostudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videostudio}
      POSTGRES_DB: ${POSTGRES_DB:-videostudio}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videostudio} -d ${POSTGRES_DB:-videostudio}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-videostudio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-videostudio-secret}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "${S3_ACCESS_KEY:-videostudio}" "${S3_SECRET_KEY:-videostudio-secret}" &&
        mc mb --ignore-existing local/${S3_BUCKET:-videos} &&
        echo "bucket ${S3_BUCKET:-videos} ready"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: vs-api:dev
    <<: *env
    environment:
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9100}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-1}      # 0 for load tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    image: vs-worker:dev
    <<: *env
    environment:
      PLANNER_MODE: ${PLANNER_MODE:-llm}      # shell/.env override; `make test-api-integration` uses mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    shm_size: 1g
    volumes:
      - jobs:/jobs
    deploy:
      replicas: ${WORKER_CONCURRENCY:-1}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    image: vs-web:dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  e2e:
    build:
      context: .
      dockerfile: infra/docker/e2e.Dockerfile
    image: vs-e2e:dev
    profiles: ["e2e"]
    shm_size: 1g
    environment:
      BASE_URL: http://web:3000
      API_URL: http://api:8000
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      web:
        condition: service_started
    volumes:
      - ./apps/web/playwright-report:/e2e/playwright-report
      - ./apps/web/test-results:/e2e/test-results

volumes:
  pgdata:
  redisdata:
  miniodata:
  jobs:
